name: dumbbill_mobile
description: "Dumbbill mobile apps: the owner app and the customer loyalty app (one codebase, two entrypoints)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  retrofit: ^4.10.0
  riverpod_annotation: ^4.0.7
  sentry_flutter: 10.1.0

dev_dependencies:
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  retrofit_generator: ^10.2.12
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  # Writes the generated translation classes into lib/l10n (see l10n.yaml).
  generate: true

  fonts:
    # Self-hosted, converted from the same files the web app uses (tool/convert_fonts.py). Each font is two
    # families, latin and latin-ext, chained with fontFamilyFallback because Flutter has no per-character files.
    # Only Inter Tight contains the rupee sign (U+20B9).
    - family: InterTight
      fonts:
        - asset: assets/fonts/InterTight-Variable.ttf
    - family: InterTightExt
      fonts:
        - asset: assets/fonts/InterTightExt-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
    - family: JetBrainsMonoExt
      fonts:
        - asset: assets/fonts/JetBrainsMonoExt-Variable.ttf
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
    - family: BarlowCondensedExt
      fonts:
        - asset: assets/fonts/BarlowCondensedExt-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowCondensedExt-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensedExt-Bold.ttf
          weight: 700
